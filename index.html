    <style>
        @font-face {
            font-family: "Vault";
            src: url(woff/020831/Hubot-Sans.woff2) format("woff2");
            font-display: swap;
        }

        :root {
            --bg-0: #04070d;
            --bg-1: #0a1420;
            --ink: #eaf4ee;
            --ink-dim: #8fa8a4;
            --ink-faint: #5c726e;
            --line: rgba(255, 255, 255, .08);
            --glass: rgba(10, 20, 30, .52);
            --green: #6effb0;
            --cyan: #3ee6ff;
            --pink: #ff5da2;
            --orange: #ffb46b;
            --js: #f7df1e;
            --css: #3d8bff;
            --svg: #ff8a3d;
            --woff: #ff5da2;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scrollbar-color: rgba(110, 255, 176, .35) transparent;
        }

        body {
            font-family: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", "Source Han Sans SC", sans-serif;
            color: var(--ink);
            background:
                radial-gradient(1200px 800px at 80% -10%, rgba(62, 230, 255, .10), transparent 60%),
                radial-gradient(1000px 700px at 10% 110%, rgba(110, 255, 176, .08), transparent 60%),
                linear-gradient(160deg, var(--bg-0), var(--bg-1) 55%, #060b12);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* 细腻噪点质感 */
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            opacity: .05;
            background-image: url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='140'%20height='140'%3E%3Cfilter%20id='n'%3E%3CfeTurbulence%20type='fractalNoise'%20baseFrequency='0.9'%20numOctaves='2'/%3E%3C/filter%3E%3Crect%20width='140'%20height='140'%20filter='url(%23n)'/%3E%3C/svg%3E");
        }

        #particles {
            position: fixed;
            inset: 0;
            z-index: 0;
        }

        .glow {
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            pointer-events: none;
            z-index: 0;
            animation: drift 16s ease-in-out infinite alternate;
        }

        .glow-a {
            width: 420px;
            height: 420px;
            top: -120px;
            right: -80px;
            background: rgba(110, 255, 176, .10);
        }

        .glow-b {
            width: 360px;
            height: 360px;
            bottom: -140px;
            left: -100px;
            background: rgba(62, 230, 255, .10);
            animation-delay: -8s;
        }

        @keyframes drift {
            from {
                transform: translate3d(0, 0, 0) scale(1);
            }
            to {
                transform: translate3d(40px, 30px, 0) scale(1.15);
            }
        }

        .vault {
            position: relative;
            z-index: 1;
            width: min(960px, calc(100% - 40px));
            margin: 0 auto;
            padding: 26px 0 40px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* ---------- 顶栏 ---------- */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 2px 0;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: "Vault", "PingFang SC", sans-serif;
            font-weight: 800;
            font-size: 17px;
            letter-spacing: .06em;
            text-decoration: none;
            color: var(--ink);
        }

        .brand-mark {
            width: 34px;
            height: 34px;
            display: grid;
            place-items: center;
            font-size: 18px;
            border-radius: 10px;
            background: linear-gradient(135deg, rgba(110, 255, 176, .16), rgba(62, 230, 255, .16));
            border: 1px solid var(--line);
            box-shadow: 0 0 22px rgba(110, 255, 176, .15) inset;
        }

        .brand b {
            color: var(--green);
            font-weight: 800;
        }

        .gh-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--ink-dim);
            text-decoration: none;
            padding: 8px 14px;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: rgba(255, 255, 255, .03);
            transition: all .25s ease;

        .gh-link:hover {
            color: var(--green);
            border-color: rgba(110, 255, 176, .45);
            box-shadow: 0 0 18px rgba(110, 255, 176, .15);
        }

            flex-direction: column;
            justify-content: center;

        .status-head {

        }

        .status-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px 28px;
            padding-top: 18px;
        }

        .stat label {
            display: block;
            font-size: 11px;
            letter-spacing: .16em;
            color: var(--ink-faint);
            margin-bottom: 7px;

        .stat p {
            font-size: 14px;
            line-height: 1.6;

            word-break: break-all;
        }

        .stat .value-mono {

            font-size: 14px;
        }

        .stat-full {
            grid-column: 1 / -1;
        }

        .stat p.placeholder {
            color: var(--ink-faint);
        }

        .stat p.offline {
            color: var(--orange);
        }

        /* ---------- 页脚 ---------- */

            text-align: center;
            font-size: 12px;
            color: var(--ink-faint);
            padding: 18px 0 6px;
            letter-spacing: .04em;
        }

        footer a {
            color: var(--ink-dim);
            text-decoration: none;
        }

        footer a:hover {
            color: var(--green);
        }

        /* ---------- 入场动画 ---------- */
        .reveal {
            opacity: 0;
            transform: translateY(26px);
            animation: rise .8s cubic-bezier(.2, .8, .2, 1) forwards;
        }

        .reveal-1 {
            animation-delay: .06s;
        }

        .reveal-2 {
            animation-delay: .16s;
        }

        .reveal-3 {
            animation-delay: .28s;
        }

        .reveal-4 {
            animation-delay: .4s;
        }

        @keyframes rise {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .glow,
            h1,
            .pulse-dot,
            .eyebrow::before {
                animation: none;
            }
            .reveal {
                animation-duration: .01s;
            }
        }

        /* ---------- 响应式 ---------- */
        @media (max-width: 760px) {
            .types {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            .status-grid {
                grid-template-columns: 1fr;
            }
            main {
                padding: 44px 0 30px;
            }
        }
    </style>
</head>

    <script>
        // ========== 粒子星网（自绘，替代 particles.js，零外部依赖） ==========
        (function () {
            var canvas = document.getElementById('particles');
            var ctx = canvas.getContext('2d');
            var particles = [];
            var mouse = { x: null, y: null };
            var W, H;
            var COLORS = ['110,255,176', '62,230,255', '255,255,255'];

            function resize() {
                var dpr = Math.min(window.devicePixelRatio || 1, 2);
                W = canvas.width = window.innerWidth * dpr;
                H = canvas.height = window.innerHeight * dpr;
                canvas.style.width = window.innerWidth + 'px';
                canvas.style.height = window.innerHeight + 'px';
                init();
            }

            function init() {
                var count = Math.min(90, Math.floor(W * H / 14000));
                particles = [];
                for (var i = 0; i < count; i++) {
                    particles.push({
                        x: Math.random() * W,
                        y: Math.random() * H,
                        vx: (Math.random() - .5) * .35 * (window.devicePixelRatio || 1),
                        vy: (Math.random() - .5) * .35 * (window.devicePixelRatio || 1),
                        r: (Math.random() * 1.6 + .6) * (window.devicePixelRatio || 1),
                        c: COLORS[Math.floor(Math.random() * COLORS.length)]
                    });
                }
            }

            function draw() {
                ctx.clearRect(0, 0, W, H);
                var linkDist = 130 * (window.devicePixelRatio || 1);

                for (var i = 0; i < particles.length; i++) {
                    var p = particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    if (p.x < 0 || p.x > W) p.vx *= -1;
                    if (p.y < 0 || p.y > H) p.vy *= -1;

                    // 与鼠标连线
                    if (mouse.x !== null) {
                        var dx = p.x - mouse.x * (window.devicePixelRatio || 1);
                        var dy = p.y - mouse.y * (window.devicePixelRatio || 1);
                        var d2 = dx * dx + dy * dy;
                        if (d2 < linkDist * linkDist) {
                            ctx.strokeStyle = 'rgba(' + p.c + ',.22)';
                            ctx.lineWidth = 1;
                            ctx.beginPath();
                            ctx.moveTo(p.x, p.y);
                            ctx.lineTo(mouse.x * (window.devicePixelRatio || 1), mouse.y * (window.devicePixelRatio || 1));
                            ctx.stroke();
                        }
                    }

                    ctx.fillStyle = 'rgba(' + p.c + ',.55)';
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fill();
                }

                // 粒子间连线
                for (var i = 0; i < particles.length; i++) {
                    for (var j = i + 1; j < particles.length; j++) {
                        var a = particles[i],
                            b = particles[j];
                        var dx = a.x - b.x,
                            dy = a.y - b.y;
                        var dist = dx * dx + dy * dy;
                        if (dist < linkDist * linkDist) {
                            ctx.strokeStyle = 'rgba(' + a.c + ',' + (0.10 * (1 - dist / (linkDist * linkDist))) + ')';
                            ctx.lineWidth = 1;
                            ctx.beginPath();
                            ctx.moveTo(a.x, a.y);
                            ctx.lineTo(b.x, b.y);
                            ctx.stroke();
                        }
                    }
                }
                requestAnimationFrame(draw);
            }

            canvas.addEventListener('mousemove', function (e) {
                mouse.x = e.clientX;
                mouse.y = e.clientY;
            });
            canvas.addEventListener('mouseleave', function () {
                mouse.x = null;
                mouse.y = null;
            });

            var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            resize();
            window.addEventListener('resize', resize);
            if (!reduceMotion) draw();
        })();

        // ========== 仓库状态：优先静态 JSON，回退 GitHub API，失败兜底 ==========
        (function () {
            var elTime = document.getElementById('lastUpdated');
            var elTypes = document.getElementById('lastUpdatedFiles');
            var elMsg = document.getElementById('lastUpdatedComments');
            var fetching = false;

            function render(data) {
                if (!data) {
                    elTime.textContent = '暂时无法获取';
                    elTime.className = 'offline';
                    elTypes.textContent = '--';
                    elTypes.className = 'offline';
                    elMsg.textContent = 'GitHub 接口暂不可用，稍后再试';
                    elMsg.className = 'offline';
                    return;
                }
                elTime.textContent = new Date(data.date).toLocaleString('zh-CN');
                elTime.className = 'value-mono';
                elTypes.textContent = data.types || '--';
                elTypes.className = 'value-mono';
                elMsg.textContent = data.message || '--';
                elMsg.className = '';
            }

            async function fromStaticJson() {
                // 加时间戳绕过缓存，确保拿到最新
                var res = await fetch('update.json?t=' + Date.now(), { cache: 'no-store' });
                if (!res.ok) throw new Error('no update.json (' + res.status + ')');
                var d = await res.json();
                if (!d || !d.date) throw new Error('invalid update.json');
                return { date: d.date, types: d.types, message: d.message };
            }

            async function fromGitHubApi() {
                var res = await fetch('https://api.github.com/repos/muziqiu2/static/commits?per_page=1');
                if (!res.ok) throw new Error('github api (' + res.status + ')');
                var list = await res.json();
                if (!list.length) throw new Error('empty commits');
                var commit = list[0];
                var detail = await fetch(commit.url);
                var cd = await detail.json();
                var types = Array.from(new Set((cd.files || []).map(function (f) {
                    var name = f.filename.split('.').pop();
                    return name ? name.toUpperCase() : '';
                }).filter(Boolean))).join(', ');
                return { date: commit.commit.author.date, types: types, message: cd.commit.message };
            }

            async function load() {
                if (fetching) return;
                fetching = true;
                try {
                    try {
                        render(await fromStaticJson());
                    } catch (e) {
                        render(await fromGitHubApi());
                    }
                } catch (e) {
                    render(null);
                } finally {
                    fetching = false;
                }
            }

            // 仅在首次加载与切回前台时刷新，避免触发 GitHub API 限流
            load();
            document.addEventListener('visibilitychange', function () {
                if (!document.hidden) load();
            });
        })();
    </script>
</body>

</html>
