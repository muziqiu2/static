name: Update Repo Info

on:
  push:
    branches: [ master ]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 生成 update.json：最后提交时间 / 文件类型 / 提交信息
      - name: Generate update.json
        run: |
          python3 - <<'EOF'
          import json, subprocess

          def sh(cmd):
              return subprocess.check_output(cmd, shell=True).decode("utf-8", "ignore").strip()

          date = sh("git log -1 --format='%cI'")
          msg = sh("git log -1 --format='%s'")
          files = sh("git show --name-only --pretty=format: HEAD")
          types = sorted({f.rsplit(".", 1)[1].upper() for f in files.splitlines() if "." in f})

          data = {"date": date, "types": ", ".join(types), "message": msg}
          with open("update.json", "w", encoding="utf-8") as f:
              f.write(json.dumps(data, ensure_ascii=False, indent=2) + "\n")
          EOF
          cat update.json

      # 提交回仓库（[skip ci] 防止循环触发本 workflow）
      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: update repo info [skip ci]"
          git push
